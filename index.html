<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volleyball Tracker</title>
<style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#182230;--muted:#6b7789;--line:#dfe6ee;--blue:#1f6feb;--shadow:0 6px 18px rgba(25,43,70,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:58px}header{position:sticky;top:0;z-index:20;background:rgba(244,247,251,.94);padding:8px 14px 5px}.topbar{display:flex;align-items:center;justify-content:space-between}.brand h1{font-size:19px;margin:0}.clear-btn{border:0;background:#eaf1fb;color:#315170;border-radius:11px;padding:7px 10px;font-size:13px;font-weight:700}main{padding:4px 10px 8px}.screen{display:none}.screen.active{display:block}.card{background:#fff;border:1px solid #e7edf4;box-shadow:var(--shadow);border-radius:17px;padding:10px;margin-bottom:8px}.section-title{display:flex;align-items:end;justify-content:space-between;gap:8px;margin-bottom:7px}.section-title h2{font-size:16px;margin:0}.section-title span{font-size:10px;color:var(--muted)}.hitter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:7px}.hitter-btn{border:1px solid var(--line);background:#f9fbfd;padding:6px 3px;border-radius:11px;font-size:12px;line-height:1.05;font-weight:800;color:#3d4b5d}.hitter-btn small{font-size:9px}.hitter-btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}.court-shell{position:relative;width:100%;height:min(61vh,540px);border-radius:14px;overflow:hidden;border:1px solid #d7dfe8;touch-action:none;user-select:none;background:#d6e4ee}.court-shell canvas{width:100%;height:100%;display:block;touch-action:none}.court-label{position:absolute;top:7px;left:7px;z-index:2;background:rgba(255,255,255,.92);padding:5px 8px;border-radius:9px;font-size:10px;font-weight:900;pointer-events:none}.tool-row{display:flex;gap:5px;margin-top:7px}.tool{flex:1;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:7px 2px;font-size:12px;font-weight:800;color:#405066}.tool.active{background:#e8f1ff;color:#1254ad;border-color:#9fc8ff}.player-add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}.player-add input,.score-control select{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;outline:none}.primary{border:0;background:var(--blue);color:#fff;border-radius:11px;padding:9px 13px;font-weight:900}.player-row{display:grid;grid-template-columns:55px 1fr auto auto;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f5}.jersey{display:flex;width:42px;height:42px;align-items:center;justify-content:center;border-radius:11px;background:#eef3f9;font-size:16px;font-weight:900}.tally{font-weight:800;color:#435266;overflow-wrap:anywhere}.stepper,.score-btn{width:36px;height:36px;border:0;border-radius:10px;font-size:19px;font-weight:800}.minus{background:#f2f4f7;color:#566477}.plus{background:#e6f7ed;color:#0a7b3c}.score-control{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.scoreboard{display:grid;gap:7px}.set-row,.team-heads{display:grid;grid-template-columns:55px 1fr 36px 1fr 36px;align-items:center;gap:6px}.set-row{padding:8px;border:1px solid #e4eaf1;border-radius:13px;background:#fafcfe}.set-name{font-weight:900;font-size:13px}.team-score{font-size:22px;font-weight:900;text-align:center;min-width:40px;cursor:pointer}.score-btn{background:#eaf1fb;color:#244e7b}.team-heads{padding:0 8px 4px;color:var(--muted);font-size:10px;text-align:center;font-weight:700}nav{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:5px 10px calc(5px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #e4e9ef}.nav-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav-btn{border:0;background:transparent;border-radius:10px;padding:5px 3px;color:#6a7788;font-size:10px;font-weight:800}.nav-btn.active{color:#155ab5;background:#edf4ff}.nav-icon{display:inline;font-size:14px;margin-right:4px}@media(max-height:700px){header{padding-top:5px}.brand h1{font-size:17px}.court-shell{height:55vh}.hitter-btn{padding:4px 2px}.tool{padding:5px 2px}.card{padding:8px}.section-title{margin-bottom:5px}}
</style>
</head>
<body>
<div class="app"><header><div class="topbar"><div class="brand"><h1>Volleyball Tracker</h1></div><button class="clear-btn" id="resetAll">Reset</button></div></header><main>
<section class="screen active" id="sprayScreen"><div class="card"><div class="section-title"><h2>Attack Spray Chart</h2><span>Swipe court left/right</span></div><div class="hitter-grid" id="hitterGrid"><button class="hitter-btn active" data-hitter="0">OH<br><small>Outside</small></button><button class="hitter-btn" data-hitter="1">MH<br><small>Middle</small></button><button class="hitter-btn" data-hitter="2">RS<br><small>Right Side</small></button><button class="hitter-btn" data-hitter="3">BR<br><small>Back Row</small></button></div><div class="court-shell" id="courtShell"><div class="court-label" id="courtLabel">Outside Hitter</div><canvas id="courtCanvas"></canvas></div><div class="tool-row"><button class="tool active" data-tool="kill">Kill Line</button><button class="tool" data-tool="draw">Free Draw</button><button class="tool" id="undoBtn">Undo</button><button class="tool" id="clearCourtBtn">Clear</button></div></div></section>
<section class="screen" id="passingScreen"><div class="card"><div class="section-title"><h2>Passing Tally</h2><span>Player numbers are manual</span></div><div class="player-add"><input id="playerNumber" inputmode="numeric" placeholder="Player number"><button class="primary" id="addPlayer">Add</button></div><div id="playerList"></div></div></section>
<section class="screen" id="scoreScreen"><div class="card"><div class="section-title"><h2>Score Box</h2><span>Maximum 25 points</span></div><div class="score-control"><label><small>Number of sets</small><select id="setCount"><option value="1">1 set</option><option value="2">2 sets</option><option value="3" selected>3 sets</option><option value="4">4 sets</option><option value="5">5 sets</option></select></label><label><small>Score adjustment</small><select id="scoreEntryMode"><option value="plus">+</option><option value="minus">−</option></select></label></div><div class="team-heads"><div></div><div>Team A</div><div></div><div>Team B</div><div></div></div><div class="scoreboard" id="scoreboard"></div></div></section>
</main></div><nav><div class="nav-inner"><button class="nav-btn active" data-screen="sprayScreen"><span class="nav-icon">↗</span>Spray</button><button class="nav-btn" data-screen="passingScreen"><span class="nav-icon">≡</span>Passing</button><button class="nav-btn" data-screen="scoreScreen"><span class="nav-icon">▻</span>Score</button></div></nav>
<script>
(()=>{
const names=['Outside Hitter','Middle Hitter','Right Side Hitter','Back Row Hitter'];let hitter=0,tool='kill',drawing=false,start=null,stroke=null;const history=[[],[],[],[]];const canvas=document.getElementById('courtCanvas'),ctx=canvas.getContext('2d'),shell=document.getElementById('courtShell'),label=document.getElementById('courtLabel');
function size(){const r=shell.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(d,0,0,d,0,0);redraw()}
function base(){const w=canvas.clientWidth,h=canvas.clientHeight,p=Math.min(w,h)*.07,x=p,y=p,cw=w-p*2,ch=h-p*2;ctx.clearRect(0,0,w,h);ctx.fillStyle='#dfeaf2';ctx.fillRect(0,0,w,h);ctx.fillStyle='#efb35d';ctx.fillRect(x,y,cw,ch);ctx.strokeStyle='#fff8e7';ctx.lineWidth=3;ctx.strokeRect(x,y,cw,ch);ctx.beginPath();ctx.moveTo(x,y+ch/2);ctx.lineTo(x+cw,y+ch/2);ctx.stroke();ctx.setLineDash([7,7]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+ch*.33);ctx.lineTo(x+cw,y+ch*.33);ctx.moveTo(x,y+ch*.67);ctx.lineTo(x+cw,y+ch*.67);ctx.stroke();ctx.setLineDash([]);drawArrow(w,h)}
function drawArrow(w,h){const pos=[[.14,.82,.28,.62],[.42,.82,.48,.61],[.84,.82,.70,.62],[.28,.91,.48,.72]][hitter],x1=w*pos[0],y1=h*pos[1],x2=w*pos[2],y2=h*pos[3],a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle='#182230';ctx.fillStyle='#182230';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-14*Math.cos(a-.55),y2-14*Math.sin(a-.55));ctx.lineTo(x2-14*Math.cos(a+.55),y2-14*Math.sin(a+.55));ctx.closePath();ctx.fill()}
function paint(s){if(!s||s.points.length<2)return;ctx.strokeStyle=s.type==='kill'?'#d93838':'#1769d2';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.type==='kill'?4:3;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.points[0].x,s.points[0].y);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x,s.points[i].y);ctx.stroke();if(s.type==='kill'&&s.done){const p=s.points[s.points.length-1];ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill()}}
function redraw(){base();history[hitter].forEach(paint);if(stroke)paint(stroke)}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;const p=point(e);start={x:p.x,y:p.y};stroke={type:tool,points:[p],done:false}});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();stroke.points.push(point(e));redraw()});function finish(e){if(!drawing)return;drawing=false;const p=point(e);stroke.points.push(p);const dx=p.x-start.x,dy=p.y-start.y,dist=Math.hypot(dx,dy);if(Math.abs(dx)>85&&Math.abs(dx)>Math.abs(dy)*1.8&&dist>85&&stroke.points.length<14){stroke=null;setHitter((hitter+(dx<0?1:-1)+4)%4);return}if(dist>3){stroke.done=true;history[hitter].push(stroke)}stroke=null;redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',()=>{drawing=false;stroke=null;redraw()});
function setHitter(n){hitter=n;label.textContent=names[n];document.querySelectorAll('.hitter-btn').forEach((b,i)=>b.classList.toggle('active',i===n));redraw()}document.querySelectorAll('.hitter-btn').forEach((b,i)=>b.addEventListener('click',()=>setHitter(i)));document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))}));document.getElementById('undoBtn').onclick=()=>{history[hitter].pop();redraw()};document.getElementById('clearCourtBtn').onclick=()=>{history[hitter]=[];redraw()};
const players=[];function tally(n){return '||||/ '.repeat(Math.floor(n/5))+'|'.repeat(n%5)}function renderPlayers(){const el=document.getElementById('playerList');el.innerHTML='';players.forEach(p=>{const row=document.createElement('div');row.className='player-row';row.innerHTML=`<div class="jersey">${p.number}</div><div class="tally">${tally(p.count)}</div><button class="stepper minus">−</button><button class="stepper plus">+</button>`;row.querySelector('.minus').onclick=()=>{p.count=Math.max(0,p.count-1);renderPlayers()};row.querySelector('.plus').onclick=()=>{p.count++;renderPlayers()};el.appendChild(row)})}function addPlayer(){const inp=document.getElementById('playerNumber'),v=inp.value.trim();if(!v||players.some(p=>p.number===v))return;players.push({number:v,count:0});inp.value='';renderPlayers()}document.getElementById('addPlayer').onclick=addPlayer;document.getElementById('playerNumber').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer()});
const scores=Array.from({length:5},()=>({a:0,b:0}));function renderScores(){const count=+document.getElementById('setCount').value,mode=document.getElementById('scoreEntryMode').value,sym=mode==='plus'?'+':'−',box=document.getElementById('scoreboard');box.innerHTML='';for(let i=0;i<count;i++){const row=document.createElement('div');row.className='set-row';row.innerHTML=`<div class="set-name">Set ${i+1}</div><div class="team-score" data-team="a">${scores[i].a}</div><button class="score-btn" data-team="a">${sym}</button><div class="team-score" data-team="b">${scores[i].b}</div><button class="score-btn" data-team="b">${sym}</button>`;row.querySelectorAll('.score-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.team;scores[i][k]=Math.max(0,Math.min(25,scores[i][k]+(mode==='plus'?1:-1)));renderScores()});row.querySelectorAll('.team-score').forEach(s=>s.onclick=()=>{const k=s.dataset.team,v=prompt('Enter score (0–25):',scores[i][k]);if(v!==null&&!isNaN(v)){scores[i][k]=Math.max(0,Math.min(25,parseInt(v)||0));renderScores()}});box.appendChild(row)}}document.getElementById('setCount').onchange=renderScores;document.getElementById('scoreEntryMode').onchange=renderScores;
document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.screen).classList.add('active');if(b.dataset.screen==='sprayScreen')requestAnimationFrame(size)});document.getElementById('resetAll').onclick=()=>{if(!confirm('Reset all tracking data?'))return;for(let i=0;i<4;i++)history[i]=[];players.length=0;scores.forEach(s=>{s.a=0;s.b=0});renderPlayers();renderScores();redraw()};window.addEventListener('resize',size);renderPlayers();renderScores();requestAnimationFrame(size);
})();
</script></body></html>
