<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Volleyball Tracker</title>
<style>
  :root{
    --bg:#f4f7fb;
    --panel:#ffffff;
    --ink:#182230;
    --muted:#6b7789;
    --line:#dfe6ee;
    --accent:#1f6feb;
    --accent2:#0b5bd3;
    --court:#f0b45f;
    --court-line:#fff7df;
    --danger:#d93838;
    --success:#159447;
    --shadow:0 10px 28px rgba(25,43,70,.09);
    --radius:22px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{min-height:100vh}
  button,input,select{font:inherit}
  button{cursor:pointer}

  .app{
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:88px;
  }

  header{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(244,247,251,.92);
    backdrop-filter:blur(14px);
    padding:18px 18px 10px;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }

  .brand h1{
    font-size:22px;
    margin:0;
    line-height:1.1;
  }

  .brand p{
    margin:5px 0 0;
    font-size:13px;
    color:var(--muted);
  }

  .clear-btn{
    border:0;
    background:#eaf1fb;
    color:#315170;
    border-radius:14px;
    padding:10px 12px;
    font-weight:700;
  }

  main{padding:8px 16px 24px}
  .screen{display:none}
  .screen.active{display:block}

  .card{
    background:var(--panel);
    border:1px solid #e7edf4;
    box-shadow:var(--shadow);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }

  .section-title{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }

  .section-title h2{
    font-size:18px;
    margin:0;
  }

  .section-title span{
    font-size:12px;
    color:var(--muted);
  }

  .hitter-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }

  .hitter-btn{
    border:1px solid var(--line);
    background:#f9fbfd;
    padding:12px 8px;
    border-radius:15px;
    font-weight:800;
    color:#3d4b5d;
  }

  .hitter-btn.active{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }

  .court-shell{
    position:relative;
    width:100%;
    aspect-ratio: 1 / 1.22;
    border-radius:18px;
    overflow:hidden;
    border:1px solid #d7dfe8;
    touch-action:none;
    user-select:none;
    background:#d6e4ee;
  }

  canvas{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
  }

  .court-label{
    position:absolute;
    top:10px;
    left:10px;
    z-index:2;
    background:rgba(255,255,255,.9);
    padding:7px 10px;
    border-radius:12px;
    font-size:12px;
    font-weight:900;
    pointer-events:none;
  }

  .tool-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }

  .tool{
    flex:1;
    border:1px solid var(--line);
    background:#f8fafc;
    border-radius:14px;
    padding:11px 8px;
    font-weight:800;
    color:#405066;
  }

  .tool.active{
    background:#e8f1ff;
    color:#1254ad;
    border-color:#bad5fb;
  }

  .hint{
    margin:10px 2px 0;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
  }

  .player-add{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    margin-bottom:12px;
  }

  .player-add input,
  .score-control input,
  .score-control select{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:13px;
    padding:12px;
    outline:none;
  }

  .primary{
    border:0;
    background:var(--accent);
    color:white;
    border-radius:13px;
    padding:12px 16px;
    font-weight:900;
  }

  .player-row{
    display:grid;
    grid-template-columns:70px 1fr auto auto;
    align-items:center;
    gap:10px;
    padding:12px 0;
    border-bottom:1px solid #edf1f5;
  }

  .player-row:last-child{border-bottom:0}
  .jersey{
    display:inline-flex;
    width:48px;
    height:48px;
    align-items:center;
    justify-content:center;
    border-radius:14px;
    background:#eef3f9;
    font-size:18px;
    font-weight:900;
  }

  .tally{
    font-size:16px;
    font-weight:800;
    color:#435266;
  }

  .stepper{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    font-size:22px;
    font-weight:800;
  }

  .minus{background:#f2f4f7;color:#566477}
  .plus{background:#e6f7ed;color:#0a7b3c}

  .score-control{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:14px;
  }

  .scoreboard{
    display:grid;
    gap:10px;
  }

  .set-row{
    display:grid;
    grid-template-columns:64px 1fr 42px 1fr 42px;
    align-items:center;
    gap:8px;
    padding:12px;
    border:1px solid #e4eaf1;
    border-radius:16px;
    background:#fafcfe;
  }

  .set-name{font-weight:900}
  .team-score{
    font-size:26px;
    font-weight:900;
    text-align:center;
    min-width:44px;
  }

  .score-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#eaf1fb;
    color:#244e7b;
    font-size:19px;
    font-weight:900;
  }

  .team-heads{
    display:grid;
    grid-template-columns:64px 1fr 42px 1fr 42px;
    gap:8px;
    padding:0 12px 6px;
    color:var(--muted);
    font-size:12px;
    text-align:center;
    font-weight:700;
  }

  nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:30;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.95);
    border-top:1px solid #e4e9ef;
    backdrop-filter:blur(14px);
  }

  .nav-inner{
    max-width:760px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .nav-btn{
    border:0;
    background:transparent;
    border-radius:14px;
    padding:10px 4px;
    color:#6a7788;
    font-size:12px;
    font-weight:800;
  }

  .nav-btn.active{
    color:#155ab5;
    background:#edf4ff;
  }

  .nav-icon{display:block;font-size:20px;margin-bottom:3px}

  @media (min-width:700px){
    .court-shell{aspect-ratio:1.42 / 1}
    .hitter-grid{grid-template-columns:repeat(4,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="brand">
        <h1>Volleyball Tracker</h1>
      </div>
      <button class="clear-btn" id="resetAll">Reset</button>
    </div>
  </header>

  <main>
    <section class="screen active" id="sprayScreen">
      <div class="card">
        <div class="section-title">
          <h2>Attack Spray Chart</h2>
          <span>Swipe court left/right</span>
        </div>

        <div class="hitter-grid" id="hitterGrid">
          <button class="hitter-btn active" data-hitter="0">OH<br><small>Outside</small></button>
          <button class="hitter-btn" data-hitter="1">MH<br><small>Middle</small></button>
          <button class="hitter-btn" data-hitter="2">RS<br><small>Right Side</small></button>
          <button class="hitter-btn" data-hitter="3">BR<br><small>Back Row</small></button>
        </div>

        <div class="court-shell" id="courtShell">
          <div class="court-label" id="courtLabel">Outside Hitter</div>
          <canvas id="courtCanvas"></canvas>
        </div>

        <div class="tool-row">
          <button class="tool active" data-tool="kill">Kill Line</button>
          <button class="tool" data-tool="draw">Free Draw</button>
          <button class="tool" id="undoBtn">Undo</button>
          <button class="tool" id="clearCourtBtn">Clear</button>
        </div>

      </div>
    </section>

    <section class="screen" id="passingScreen">
      <div class="card">
        <div class="section-title">
          <h2>Passing Tally</h2>
          <span>Player numbers are manual</span>
        </div>

        <div class="player-add">
          <input id="playerNumber" inputmode="numeric" placeholder="Player number" />
          <button class="primary" id="addPlayer">Add</button>
        </div>

        <div id="playerList"></div>
      </div>
    </section>

    <section class="screen" id="scoreScreen">
      <div class="card">
        <div class="section-title">
          <h2>Score Box</h2>
          <span>Maximum 25 points</span>
        </div>

        <div class="score-control">
          <label>
            <small>Number of sets</small>
            <select id="setCount">
              <option value="1">1 set</option>
              <option value="2">2 sets</option>
              <option value="3" selected>3 sets</option>
              <option value="4">4 sets</option>
              <option value="5">5 sets</option>
            </select>
          </label>

          <label>
            <small>Manual score entry</small>
            <select id="scoreEntryMode">
              <option value="plus">+</option>
              <option value="minus">−</option>
            </select>
          </label>
        </div>

        <div class="team-heads">
          <div></div><div>Team A</div><div></div><div>Team B</div><div></div>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
      </div>
    </section>
  </main>
</div>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-screen="sprayScreen">
      <span class="nav-icon">↗/</span>Spray
    </button>
    <button class="nav-btn" data-screen="passingScreen">
      <span class="nav-icon">≡</span>Passing
    </button>
    <button class="nav-btn" data-screen="scoreScreen">
      <span class="nav-icon">▻</span>Score
    </button>
  </div>
</nav>

<script>
(() => {
  const hitterNames = ["Outside Hitter", "Middle Hitter", "Right Side Hitter", "Back Row Hitter"];
  let currentHitter = 0;
  let activeTool = "kill";
  const histories = [[],[],[],[]];
  let drawing = false;
  let currentStroke = null;
  let swipeStartX = null;
  let swipeStartY = null;

  const canvas = document.getElementById("courtCanvas");
  const ctx = canvas.getContext("2d");
  const shell = document.getElementById("courtShell");
  const label = document.getElementById("courtLabel");

  function resizeCanvas(){
    const rect = shell.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + "px";
    canvas.style.height = rect.height + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    redraw();
  }

  function drawCourtBase(){
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;

    ctx.clearRect(0,0,w,h);

    ctx.fillStyle = "#dfeaf2";
    ctx.fillRect(0,0,w,h);

    const pad = Math.min(w,h) * 0.07;
    const courtX = pad;
    const courtY = pad;
    const courtW = w - pad*2;
    const courtH = h - pad*2;

    ctx.fillStyle = "#efb35d";
    ctx.fillRect(courtX,courtY,courtW,courtH);

    ctx.strokeStyle = "#fff8e7";
    ctx.lineWidth = 3;
    ctx.strokeRect(courtX,courtY,courtW,courtH);
